include ~/.config/omarchy/current/theme/kitty.conf

enabled_layouts splits,stack

# Font
font_family JetBrainsMono Nerd Font
bold_italic_font auto
font_size        12

shell zsh

# Window
window_padding_width 14
window_padding_height 14
hide_window_decorations yes
show_window_resize_notification no
confirm_os_window_close 0

# Keybindings
kitty_mod ctrl+shift

map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

map ctrl+shift+l

map ctrl+shift+v launch --location=vsplit --cwd=current

map kitty_mod+l launch --location=vsplit --cwd=current lazygit
map ctrl+shift+p launch --hold --location=vsplit "~/.config/kitty/scripts/zmx_picker.sh"

# Allow remote access
single_instance yes
allow_remote_control yes

# Aesthetics
cursor_shape block
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
